<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="calculadora-container">
    <div id="display" class="display">0</div>

    <div class="buttons-grid">

        <button class="btn-calc btn-clear" onclick="limpar()">C</button>
        <button class="btn-calc btn-operacao" onclick="adicionarOperacao('DIVISAO')">÷</button>
        <button class="btn-calc btn-operacao" onclick="adicionarOperacao('MULTIPLICACAO')">x</button>
        <button class="btn-calc btn-operacao" onclick="adicionarOperacao('SUBTRACAO')">-</button>

        <button class="btn-calc btn-numero" onclick="adicionarDigito('7')">7</button>
        <button class="btn-calc btn-numero" onclick="adicionarDigito('8')">8</button>
        <button class="btn-calc btn-numero" onclick="adicionarDigito('9')">9</button>
        <button class="btn-calc btn-operacao span-2-row" onclick="adicionarOperacao('SOMA')">+</button>

        <button class="btn-calc btn-numero" onclick="adicionarDigito('4')">4</button>
        <button class="btn-calc btn-numero" onclick="adicionarDigito('5')">5</button>
        <button class="btn-calc btn-numero" onclick="adicionarDigito('6')">6</button>

        <button class="btn-calc btn-numero" onclick="adicionarDigito('1')">1</button>
        <button class="btn-calc btn-numero" onclick="adicionarDigito('2')">2</button>
        <button class="btn-calc btn-numero" onclick="adicionarDigito('3')">3</button>
        <button class="btn-calc btn-igual span-2-row" onclick="calcularResultado()">=</button>

        <button class="btn-calc btn-numero" onclick="adicionarDigito('0')">0</button>
        <button class="btn-calc btn-decimal" onclick="adicionarDigito('.')">.</button>
        <button class="btn-calc btn-numero" onclick="adicionarDigito('00')">00</button>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
